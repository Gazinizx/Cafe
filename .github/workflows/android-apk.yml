name: Cafe Dunyam Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: cafe-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android platform dosyalarını oluştur
        working-directory: mobil
        run: flutter create --platforms=android --project-name cafe_dunyam .
      - name: Simge dönüştürme aracını izole kur
        run: |
          python3 -m venv /tmp/cafe-icon-venv
          /tmp/cafe-icon-venv/bin/pip install cairosvg
      - name: Logo dosyasını Android simgesine hazırla
        working-directory: mobil
        run: |
          /tmp/cafe-icon-venv/bin/python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="assets/cafe_icon.svg", write_to="assets/app_icon.png", output_width=512, output_height=512)
          PY
      - name: NFC iznini ekle
        working-directory: mobil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.NFC" not in s:
              s = s.replace("<application", '    <uses-permission android:name="android.permission.NFC" />\n    <application', 1)
          if "android.hardware.nfc" not in s:
              s = s.replace("<application", '    <uses-feature android:name="android.hardware.nfc" android:required="false" />\n    <application', 1)
          s = re.sub(r'android:label="[^"]+"', 'android:label="Cafe Dünyam"', s, count=1)
          p.write_text(s)
          for gradle in Path("android/app").glob("build.gradle*"):
              g = gradle.read_text()
              g = re.sub(r'(?m)^\s*applicationId\s*(?:=\s*)?"[^"]+"', 'applicationId = "com.cafedunyam.app"', g)
              g = re.sub(r'(?m)^\s*namespace\s*(?:=\s*)?"[^"]+"', 'namespace = "com.cafedunyam.app"', g)
              if "com.cafedunyam.app" not in g:
                  raise SystemExit(f"Android package id could not be set: {gradle}")
              gradle.write_text(g)
          PY
      - name: Paketleri indir
        working-directory: mobil
        run: flutter pub get
      - name: NFC eklentisinin Android compileSdk değerini düzelt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path.home().glob('.pub-cache/hosted/pub.dev/nfc_manager-*/android/build.gradle'))
          if not files:
              raise SystemExit('nfc_manager Android build.gradle bulunamadı')
          for p in files:
              s = p.read_text()
              updated = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', s)
              updated = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 35', updated)
              if updated == s and 'compileSdkVersion 35' not in s and 'compileSdk = 35' not in s:
                  raise SystemExit(f'compileSdk satırı otomatik düzeltilemedi: {p}')
              p.write_text(updated)
              print(f'compileSdk 35 ayarlandı: {p}')
          PY
      - name: Android uygulama simgesini üret
        working-directory: mobil
        run: dart run flutter_launcher_icons
      - name: APK derle
        working-directory: mobil
        run: flutter build apk --release
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: cafe-dunyam-android-apk
          path: mobil/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
