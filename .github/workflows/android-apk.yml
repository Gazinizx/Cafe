name: Cafe Dunyam Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android platform dosyalarını oluştur
        working-directory: mobil
        run: flutter create --platforms=android --project-name cafe_dunyam .
      - name: Paketleri indir
        working-directory: mobil
        run: flutter pub get
      - name: APK derle
        working-directory: mobil
        run: flutter build apk --release
      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: cafe-dunyam-android-apk
          path: mobil/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
