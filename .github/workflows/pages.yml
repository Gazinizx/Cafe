name: Publish Cafe Dünyam Website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'yonetim/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare website
        run: |
          mkdir -p public/yonetim
          cp index.html public/index.html
          cp yonetim/index.html public/yonetim/index.html
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Upload website
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy website
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
