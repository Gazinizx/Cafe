<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cafe Dünyam Yönetim</title><style>body{margin:0;background:#f7f1e5;color:#24392e;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:22px}.hero{background:#174c3c;color:white;padding:24px;border-radius:20px}.note{background:#e8dcc7;padding:13px;border-radius:12px;line-height:1.5;margin:15px 0}.tabs,form{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button{border:0;padding:11px 14px;border-radius:9px;cursor:pointer}.tabs button,.go{background:#174c3c;color:white}.panel{background:white;padding:18px;border-radius:15px;margin:14px 0}input{padding:11px;border:1px solid #ddd;border-radius:9px;flex:1;min-width:120px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}.del{background:#eee7db;color:#174c3c}.hide{display:none}@media(max-width:600px){.wrap{padding:12px}td,th{font-size:12px;padding:6px}}</style><body><main class="wrap"><header class="hero"><h1>☕ Cafe Dünyam</h1><p>Kafe ve kampanya yönetim paneli</p></header><div class="note"><b>Veritabanı olmadan:</b> bilgiler yalnızca bu tarayıcıda saklanır. Mobil uygulamaya eşitlenmez; gerçek kullanıcı girişi ve yetkilendirme yoktur.</div><nav class="tabs"><button onclick="tab('cafes')">Kafeler</button><button onclick="tab('offers')">Kampanyalar</button><button onclick="backup()">JSON yedekle</button></nav><section id="cafes" class="panel"><h2>Kafe ekle</h2><form id="cf"><input name="name" placeholder="Kafe adı" required><input name="city" placeholder="Şehir" required><input name="type" placeholder="Kategori" required><input name="goal" type="number" value="8" min="1" required><button class="go">Ekle</button></form><table><thead><tr><th>Kafe</th><th>Şehir</th><th>Kategori</th><th>Hedef</th><th></th></tr></thead><tbody id="cr"></tbody></table></section><section id="offers" class="panel hide"><h2>Kampanya ekle</h2><form id="of"><input name="title" placeholder="Kampanya adı" required><input name="benefit" placeholder="Avantaj / indirim" required><input name="audience" placeholder="Hedef kitle" required><button class="go">Ekle</button></form><table><thead><tr><th>Kampanya</th><th>Avantaj</th><th>Hedef</th><th></th></tr></thead><tbody id="or"></tbody></table></section></main><script>
const c0=[{name:"Kahve Durağı",city:"İstanbul",type:"Kahve ve tatlı",goal:8},{name:"Mola Coffee",city:"Ankara",type:"Modern kahve",goal:6}],o0=[{title:"Öğrenci fırsatı",benefit:"%15 indirim",audience:"Öğrenci"}];function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d.map(x=>({...x}))}catch(e){return d.map(x=>({...x}))}}let cs=read("cafe-cs",c0),os=read("cafe-os",o0);function esc(v){return String(v).replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[a]))}function save(){localStorage.setItem("cafe-cs",JSON.stringify(cs));localStorage.setItem("cafe-os",JSON.stringify(os));render()}function render(){cr.innerHTML=cs.map((v,i)=>'<tr><td>'+esc(v.name)+'</td><td>'+esc(v.city)+'</td><td>'+esc(v.type)+'</td><td>'+v.goal+'</td><td><button class="del" onclick="cs.splice('+i+',1);save()">Sil</button></td></tr>').join("");or.innerHTML=os.map((v,i)=>'<tr><td>'+esc(v.title)+'</td><td>'+esc(v.benefit)+'</td><td>'+esc(v.audience)+'</td><td><button class="del" onclick="os.splice('+i+',1);save()">Sil</button></td></tr>').join("")}function tab(id){document.querySelectorAll("section").forEach(s=>s.classList.toggle("hide",s.id!==id))}cf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(cf));cs.push({name:d.name,city:d.city,type:d.type,goal:+d.goal});cf.reset();save()};of.onsubmit=e=>{e.preventDefault();os.push(Object.fromEntries(new FormData(of)));of.reset();save()};function backup(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify({cafes:cs,offers:os},null,2)],{type:"application/json"}));a.href=u;a.download="cafe-dunyam-yedek.json";a.click();URL.revokeObjectURL(u)}render();
</script></body></html>
