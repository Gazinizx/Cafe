name: cafe_dunyam
description: Cafe Dunyam mobil arayuz prototipi.
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  nfc_manager: ^3.5.0
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#080706"
  adaptive_icon_foreground: "assets/app_icon.png"
